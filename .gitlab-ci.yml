---
# GitLab CI/CD Pipeline for metrics
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.55.6

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.55.6
    inputs:
      # Must match ZIG_VERSION below: the component sets a job-level
      # ZIG_VERSION from this input, which shadows the global variable.
      zig_version: "0.16.0"

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.55.6

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.6

variables:
  # S-022(c): security-relevant pin — SHA-verified by .install-zig against the
  # ziglang.org download index; do not override via pipeline variables.
  ZIG_VERSION: "0.16.0"
  # S-022(a): digest-pinned base image (debian:bookworm-slim as of 2026-06-11).
  CI_BASE_IMAGE: "debian:bookworm-slim@sha256:96e378d7e6531ac9a15ad505478fcc2e69f371b10f5cdf87857c4b8188404716"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  # S-022(d): re-verify cached Zig binary on every run. A cache that fails
  # verification aborts the job; a cache missing its verification marker is
  # purged so the download step below re-fetches and re-verifies it.
  - |
    if [ -f "zig-${ZIG_VERSION}/zig" ]; then
      if [ -f "zig-${ZIG_VERSION}/.zig-binary.sha256" ]; then
        sha256sum --check --strict "zig-${ZIG_VERSION}/.zig-binary.sha256" || { echo "Cached Zig binary failed verification (S-022d)"; exit 1; }
      else
        echo "Cached Zig binary missing verification marker; purging cache for re-download (S-022d)"
        rm -rf "zig-${ZIG_VERSION}"
      fi
    fi
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
      # S-022(d): record binary checksum so cached copies are re-verified above.
      sha256sum "zig-${ZIG_VERSION}/zig" > "zig-${ZIG_VERSION}/.zig-binary.sha256"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component's before_script with the project's hardened
# install (SHA-verified + S-022d cache re-verification). The component's
# zig_version input is pinned at the include above so the job-level
# ZIG_VERSION matches the project pin.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build check
    - zig build example

# Compile-only benchmark gate (GAP-005): catches stdlib API drift in
# benchmark sources without running them.
bench-check:
  stage: build
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build bench-check

# Unit tests
test:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Results are stored as artifacts for trend analysis.
bench-regression:
  stage: fuzz
  image: $CI_BASE_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  needs:
    - build
